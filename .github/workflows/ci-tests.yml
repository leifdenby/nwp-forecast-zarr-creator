name: tests

on:
  push:
    branches: "*"
  pull_request:
    branches: "*"

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run unit tests
        run: uv run pytest -m "not integration" -q
